name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: 校验 SemVer 标签
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "release tag must be SemVer, got: ${tag}"
            exit 1
          fi

  cli:
    needs: validate
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            extension: .exe
            archive: zip
          - goos: linux
            goarch: amd64
            extension: ""
            archive: tar
          - goos: darwin
            goarch: amd64
            extension: ""
            archive: tar
          - goos: darwin
            goarch: arm64
            extension: ""
            archive: tar

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: 构建 CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME}"
          name="seelex-${version}-${GOOS}-${GOARCH}"
          mkdir -p "stage/${name}/config"
          go build -trimpath -ldflags="-s -w -X github.com/RedHuang-0622/seelex/internal/buildinfo.Version=${version}" \
            -o "stage/${name}/seelex${{ matrix.extension }}" .
          cp config/accounts.example.yaml "stage/${name}/config/"
          cp config/seele.yaml config/seelex.yaml "stage/${name}/config/"
          cp config/mcp.example.yaml config/search_engine.example.yaml "stage/${name}/config/"
          cp -r plugins "stage/${name}/"
          cp LICENSE CHANGELOG.md README.md "stage/${name}/"
          if [ -f README_EN.md ]; then
            cp README_EN.md "stage/${name}/"
          fi
          unexpected="$(find "stage/${name}" \( \
            -path '*/.seelex' -o \
            -path '*/config/accounts.yaml' -o \
            -path '*/config/mcp.yaml' -o \
            -path '*/config/search_engine.yaml' -o \
            -path '*/.seelex/*' -o \
            -name '*.local.yaml' -o \
            -name '*.secret.yaml' \
          \) -print)"
          if [ -n "${unexpected}" ]; then
            echo "unsafe files found in release stage:"
            echo "${unexpected}"
            exit 1
          fi
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd stage && zip -qr "${name}.zip" "${name}")
            sha256sum "stage/${name}.zip" > "stage/${name}.zip.sha256"
          else
            tar -czf "stage/${name}.tar.gz" -C stage "${name}"
            sha256sum "stage/${name}.tar.gz" > "stage/${name}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            stage/*.zip
            stage/*.tar.gz
            stage/*.sha256
          if-no-files-found: error

  gui-windows:
    needs: validate
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: 构建 Windows GUI
        shell: pwsh
        run: |
          & .\scripts\build-gui.ps1 -Version $env:GITHUB_REF_NAME -BuildKind Publish

      - name: 审计 GUI 发布包
        shell: pwsh
        run: |
          $auditRoot = Join-Path $env:RUNNER_TEMP "seelex-gui-audit"
          New-Item -ItemType Directory -Force -Path $auditRoot | Out-Null
          foreach ($archive in Get-ChildItem dist/archive -Filter "*-gui.zip") {
            $target = Join-Path $auditRoot $archive.BaseName
            Expand-Archive -LiteralPath $archive.FullName -DestinationPath $target -Force
            $unsafe = Get-ChildItem $target -Recurse -Force | Where-Object {
              $_.FullName -match '[\\/]\.seelex([\\/]|$)' -or
              $_.FullName -match '[\\/]config[\\/]accounts\.yaml$' -or
              $_.Name -match '\.(local|secret)\.yaml$'
            }
            if ($unsafe) {
              $unsafe.FullName | Write-Error
              throw "unsafe files found in GUI release archive"
            }
          }

      - uses: actions/upload-artifact@v7
        with:
          name: gui-windows-amd64
          path: |
            dist/archive/*-gui.zip
            dist/archive/*-gui.zip.sha256
          if-no-files-found: error

  # Linux GUI 是 cgo + GTK3 + WebKit2GTK 产物，Windows/macOS 上交叉编不出来
  # （CGO_ENABLED=0 GOOS=linux 会 undefined: Frontend），历史上只能靠 Linux 侧手工
  # scripts/build-linux-gui.sh 出包（v0.1.0 的 linux-amd64-gui 就是这么补的）。
  # 这条腿把它并进流水线：ubuntu-22.04 上装 gtk3/webkit2gtk-4.0 开发包，走脚本的
  # --native 分支原地构建，ABI 与手工路径一致（4.0 + libsoup-2.4）。
  gui-linux:
    needs: validate
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.25"
          cache: true

      - name: 安装 GTK3 / WebKit2GTK(4.0) 构建依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.0-dev pkg-config

      # build-linux-gui.sh --native 走 GOFLAGS=-mod=vendor，要求工作区里有 vendor/；
      # 而 vendor/ 被 .gitignore 排除（不入库），干净检出上并不存在 —— 缺了它 Go 直接报
      #   go: inconsistent vendoring ... : is explicitly required in go.mod,
      #   but not marked as explicit in vendor/modules.txt
      # 并让 gui-linux 红掉、publish 被 skip（CI run 37120061853 就是这样，release 资产没被换）。
      - name: 预置 vendor 目录（--native 构建要求 -mod=vendor）
        run: go mod vendor

      - name: 构建 Linux GUI
        run: bash scripts/build-linux-gui.sh --version "$GITHUB_REF_NAME" --native

      - name: 审计 Linux GUI 发布包
        shell: bash
        run: |
          set -euo pipefail
          audit="$(mktemp -d)"
          unsafe=0
          for archive in dist/archive/*-gui.tar.gz; do
            dir="${audit}/$(basename "${archive}" .tar.gz)"
            mkdir -p "${dir}"
            tar -xzf "${archive}" -C "${dir}"
            hits="$(find "${dir}" \( \
              -path '*/.seelex' -o \
              -path '*/.seelex/*' -o \
              -path '*/config/accounts.yaml' -o \
              -path '*/config/mcp.yaml' -o \
              -path '*/config/search_engine.yaml' -o \
              -name '*.local.yaml' -o \
              -name '*.secret.yaml' \
            \) -print)"
            if [ -n "${hits}" ]; then
              echo "unsafe files found in Linux GUI release archive ${archive}:"
              echo "${hits}"
              unsafe=1
            fi
          done
          if [ "${unsafe}" -ne 0 ]; then
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: gui-linux-amd64
          path: |
            dist/archive/*-gui.tar.gz
            dist/archive/*-gui.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [cli, gui-windows, gui-linux]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/*.zip
            artifacts/*.tar.gz
            artifacts/*.sha256
