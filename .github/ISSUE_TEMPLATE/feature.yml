name: Design or feature proposal
description: Propose a focused harness capability or engineering improvement.
title: "[Proposal]: "
labels: ["enhancement", "needs-design"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or engineering problem without prescribing an implementation.
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Concrete use case
      description: Show the task, current limitation, and observable success criteria.
    validations:
      required: true
  - type: dropdown
    id: boundary
    attributes:
      label: Primary boundary
      options:
        - Application / protocol
        - Runtime / Seele bridge
        - Context / memory
        - Plan / subagent orchestration
        - Tool / permission / workspace
        - Plugin / Skill / MCP
        - Persistence
        - TUI / GUI
        - CI / release / documentation
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Design constraints and trade-offs
      description: Include compatibility, security, concurrency, persistence, cost, and testing implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What simpler or existing approach was considered?
