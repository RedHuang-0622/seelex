# ── Seelex 运行参数配置 ─────────────────────────────────────
# 本文件只放行为参数（上下文窗口 / 运行时上限）；权限规则在 seele.yaml。
# 缺失字段 → 默认值（与旧硬编码一致）；无需改代码即可调参。

# ── 上下文滑动窗口（window）─────────────────────────────
# 会话请求保留的最新完整轮数 N：N = clamp((上下文窗口 × ratio − 预留) ÷ 每轮 token,
# min_rounds, max_rounds)。零值 = 未配置，使用默认值（ratio 0.7 / min_rounds 4 /
# max_rounds 40）；rounds 显式配置时直接覆盖推导结果。
# 轮数公式的实际生效面：框架上下文控制器（seelexctx Controller，有每轮 token 估算）。
# 主会话冷恢复的读分片宽度只拿得到上下文窗口一个输入，推导分支不生效，恒等于
# min_rounds（见 seelebridge/runtime_context.go 的 windowTailBudget）。轮数也不是压缩
# 保留前缀的口径：保留前缀只由下面的 min(token1, token2) token 规则决定。
#
# 压缩保留前缀窗口（软压缩）：保留前缀 token 预算 = min(token1, token2)，取两个
# 窗口的较小者，窗口外部分尽数交给 compact_context 压缩（原始轮次仍在会话存储里）：
#   token1 = retain_tokens（硬编码在配置里的保留窗口 token 数；0 = 未配置 → 回退账号
#            上下文窗口 accounts.yaml context_window）
#   token2 = ratio × all_context（全量上下文 token 数 × 可用比例）
# 同一规则也是**读尾**（冷恢复装载 transcript/history 尾部）的 token 预算：读尾发生在
# 请求装配之前、没有"本次要携带的上下文"可估，all_context 取账号上下文窗口——
# 未达上限的会话不会被占比窗口误裁，读尾只做重建、不新做压缩决策。
# 硬压缩：all_context ≥ force_compact_tokens 时必须自主压缩，不再等 provider 比例阈值
# （0 = 未配置，压缩只由软策略驱动）。
window:
  rounds: 0        # 显式覆盖窗口轮数（0 = provider 推导 clamp；该推导只对框架控制器路径
                   # 有完整输入，主会话冷读分片宽度取 min_rounds）
  ratio: 0.7       # 上下文窗口可用比例（同时是占比窗口 token2 的比例）
  retain_tokens: 0 # 保留窗口 token 数 token1（0 = 回退账号上下文窗口）
  force_compact_tokens: 0 # 硬压缩阈值：all_context token 数（0 = 只走软压缩）
  min_rounds: 4    # 轮数下限（clamp 下界；也是主会话冷读分片的实际宽度）
  max_rounds: 40   # 轮数上限（clamp 上界，只对框架控制器路径生效）

# ── 运行时上限（limits）─────────────────────────────────
# 全部行为魔法数字收编为可调参数；缺失字段 → 默认值（与旧硬编码一致）。
# 时延类单位：秒（0 仅 tool_call_timeout 表示无限制）。
limits:
  tool_call_timeout: 1800        # 工具调用超时秒（0 = 无限制；默认 1800 = 30 分钟）
  approval_timeout: 600          # 审批等待秒（默认 600 = 10 分钟）
  plan_decision_timeout: 10      # preflight 决策回合秒（默认 10）
  heartbeat_interval: 15         # workplan 心跳间隔秒（默认 15；详情页"最后活跃"时间线）
  replan_window: 60              # replan 频率窗口秒（默认 60）
  search_timeout: 15             # 搜索 HTTP 超时秒（默认 15；旧字段 tavily_timeout 兼容）
  max_concurrent_replans: 2      # replan 并发上限（默认 2）
  max_replans_per_window: 6      # 窗口内 replan 次数（默认 6）
  max_replan_provider_requests: 6 # 窗口内 provider 请求预算（默认 6）
  max_replans_per_plan_chain: 2  # 单计划链 replan 次数（默认 2）
  history_window: 200            # 会话可见历史条数（默认 200）
  # ── 会话释放面（LRU 窗口）──────────────────────────────────────────
  # session_release_window：**受保护集之外**最多保留几个「已加载」的会话。
  #   受保护集 = 当前视图会话 ∪ 待审批会话 ∪ 运行/排队/在飞会话 ∪ 正在恢复的会话
  #   （它们永不释放）；其余会话（典型：切走之后回合跑完的那个）按 LRU 释放。
  #     1 = 只保留上一个（默认口径：切走一个不释放，再切走一个才释放最旧的）
  #     N = 再保留 N 个（越大越顺滑，代价是常驻内存越多）
  #   释放 = 引擎实例 + 桥侧会话本体（框架 Session / 会话上下文存储 / 主历史）
  #   + 可见正文一起放掉；会话单元、目录行、磁盘事实保留，重开走冷加载。
  session_release_window: 1
  # 界面可调：设置 → 会话驻留可把它改成 1..16（窗口是现读的 ⇒ 立刻生效、不必重启）；
  # 界面上改的值落盘在数据根的 runtime-limits.json，启动时作**最高优先覆盖层**叠在
  # 本段之上（内置默认 ← 本段 ← runtime-limits.json）。
  # 分层覆盖（可选，显式 >0 才生效；0/缺省 = 交给上面的窗口统一管辖）：
  #   resident_limit        引擎 bundle 层按「驻留会话总数上限」算（**含**受保护会话）
  #   loaded_content_limit  可见正文层同上（历史默认 6 / 12，按 2× 留余量）
  # 只想单独约束某一层（例如"正文窗口放宽、引擎仍然只留一个"）的现场用它。
  #resident_limit: 6
  #loaded_content_limit: 12
  plan_node_events: 30           # 节点详情时间线上限（默认 30）
  plan_node_max_loops: 384       # 子代理节点循环上限（默认 384；与默认档位 high 的循环次数一致）
  evidence_chars: 800            # 证据/输出截断（默认 800）
  work_table_rows: 200           # 工作表格最大行数（默认 200；概览打点 ≤10/行）
  replan_evidence_bytes: 12288   # replan 证据字节上限（默认 12 KB）
  input_loop_limit: 9999         # 输入循环上限（默认 9999 ≈ 无上限）
  reference_page_size: 4000      # read_tool_result/read_compressed_turn 默认分页（默认 4000）
  max_reference_page_size: 12000 # 分页上限（默认 12000）
  grep_max_results: 20           # grep 默认结果数（默认 20）
  session_name_runes: 16         # 会话名截断（默认 16）
  preflight_retry: 2             # preflight 重试次数（默认 2）
  output_reserve_tokens: 512     # **仅兜底路径 + 启动期校验生效**（默认 512）：运行期压缩预算的输出预留取**账号档 max_tokens**，不是这个键（见下）
  # ── 三个容易混的数，动手前先分清（2026-10-15）────────────────────
  #   ① 上下文窗口（token，模型的物理上限）：默认取**账号档** config/accounts.yaml 的
  #      defaults.context_window（账号条目可覆盖）→ Runtime.ContextWindow()；
  #      **本段的 `context_window` 可覆盖它**（0 = 不覆盖）。覆盖是全局的（所有账号含
  #      子代理一刀切），且只改"判据用的窗口"——provider 侧仍有自己的硬限制，填得比
  #      模型真实窗口大，请求会被 provider 拒。
  #   ② 压缩触发线（token）：本文件的 context_hard_percent × 预算。
  #      到达即折出保留窗口外的 transcript 前缀，这是自动压缩**唯一**的阈值。
  #   ③ 超大工具结果上限（**字符数**，不是 token、与预算无关）：本文件的
  #      max_tool_result_chars。超过就把整条结果归档为 result_ref，请求里只留引用。
  #      另有一组**存储侧**同类键 session_storage.big_tool_result_*（字符软限截断 /
  #      字节硬限报错 / 会话配额），实现在 sessionstore/big_tool_result.go；**当前
  #      没有生产调用方**（只有单测），软限也**不调 LLM 做总结**（软限只截断）。
  #   ② 与 ③ 是两套口径：② 管"上下文要装不下了"，③ 管"单条结果太长"。调 ③ 不改 ②，
  #   改窗口也不会放宽 ③；报错里说 tokens 的是 ②（或窗口），说 chars 的才是 ③。
  context_window: 400000          # 上下文窗口的默认值（token；0 = 不覆盖，回落账号档）。**界面「设置 → 账号」可按账号覆盖它**（挡位 200k/400k/600k/1M 或自定义；写进数据根 runtime-limits.json，优先级最高）。2026-10-15 定为 40 万：本机账号档记的是旧窗口，而窗口是预算的基数（预算 = 窗口 − 账号档 max_tokens − 窗口 ÷ 安全除数）
  # ── 上下文压缩预算（0 = 用默认值）───────────────────────────────
  # 预算 budget = 账号档 max_tokens（输出预留）与 context_window 推导：
  #   budget = context_window − max_tokens − context_window ÷ 安全除数；
  # 下面各百分比都以 budget 为基数。各键的消费者**逐个列明**：
  #   context_safety_reserve_divisor / context_hard_percent
  #     → 装配层消费（application/core/task_context，发请求前每次算一次）：请求估算
  #       （与引擎缓存峰值取大）≥ budget×hard% 就压缩可变 transcript——这是自动路径
  #       **唯一**的阈值；显式入口（/compact、compact_context）与 window.force_compact_tokens
  #       不受它约束。
  #   context_soft_percent → **2026-09-30 起不再被消费（取消软线提前量）**：压缩会改写
  #       请求前缀，provider 的前缀缓存整段作废，折回来的余量不值得每轮付这份代价，
  #       所以只在真的逼近上限时折一次。键保留只为兼容既有配置（报告面展示的 soft 与
  #       hard 同源，不再出现"报表说已过软线、系统却没折"的口径分裂）；下一版连同
  #       seelexctx.LoadLimits 的 soft<hard 校验一起摘除。
  #       **在摘除之前，soft 必须 < hard，否则启动期直接报错**——所以 2026-10-15
  #       把 hard 从 98 降到 90 时，soft 一并从 95 降到 85。它不是判据，取值只为满足
  #       这条相对关系（想换别的值，只要仍 < hard 即可）。
  #   context_target_percent     → 压缩后落点（装配层保留窗口决策的硬上限）
  #   context_single_item_percent → 装配层消费（单条超大输入外置）
  #   context_retain_floor_percent → 保留窗口下限（装配层决策 + main 启动期校验）
  # 回合内框架控制器（seelexctx）2026-09-30 起**不再折对话**：它只拿得到装配前的引擎
  # 工作历史（system/项目/记忆/前缀栈/工具面都还没进去），折出来的帧没有读后感——而
  # 压缩是"产出元数据 + 由模型按章节写读后感"这条流程里的一步，只有握着上一次真实请求
  # 原件的装配层做得到。控制器现在只剩一个动作：超大工具结果的兜底归档。
  # 出厂档（本文件）= 除数 10，soft 85，hard 90，target 65，single-item 50；
  # 代码内置兜底档（seelexctx.DefaultLimits）= 除数 8，soft 95，hard 98，target 80，
  # single-item 50（只在本文件整块缺失时生效）。软线已不参与判据，两档都留着它，
  # 免得旧配置读回来"键没了"。
  #
  # 想"尽量不压"怎么办：这里**没有**自动压缩总开关（有意为之——压缩是"还能不能继续
  # 说话"的安全网，不是可选优化）。可行的近似是把 context_hard_percent 调到很高
  # （如 99/100）并把 window.force_compact_tokens 留 0（不启用硬压缩）；代价是请求会
  # 一直贴着预算上限，而且在装不下时装配层会**直接拒绝发送**（estimated > budget →
  # ErrProviderContextBudgetExceeded），而不是把你想要的原文硬塞进去。
  context_safety_reserve_divisor: 10  # 安全预留 = 窗口 ÷ 该值。调小（如 4）→ 预留更多、预算更小、更早开始压缩
  context_soft_percent: 85            # 已不参与判据（2026-09-30 取消软线，见上）；**必须 < context_hard_percent**，否则启动期报错。2026-10-15 随 hard 由 98 降到 90 一并从 95 调到 85
  context_hard_percent: 90            # 自动压缩的**唯一**阈值：请求估算 ≥ budget×90% 就压缩可变 transcript。调低 → 更"绝不贴边发送"；调高 → 允许历史更满（2026-10-15 由 98 调回 90）
  context_target_percent: 65          # 压缩目标：压缩后把请求大小压回 budget×65% 附近（保留区硬上限），给下一轮留 hard − target = 25% 预算的确定余量。与 hard 的差 = 每次压掉的量；落点够不到判据线时装配层跳过这次压缩（幂等/有效性校验）
  context_single_item_percent: 50     # 单条输入外置阈值：一条输入超 budget×50% 就先归档为 result_ref，请求里只放引用
  # 保留区下限（占预算 %；0 = 未配置 → 下限只剩「至少 1 个完整协议单元」兜底）：
  # 保留区 = clamp(占比 × 全量, floor, retain_tokens)，floor = max(最近 1 个完整协议单元, 该比例 × 预算)。
  # floor > window.retain_tokens 是非法组合，启动期直接报错（不许静默取小）。
  context_retain_floor_percent: 0
  # 帧摘要传递上限（token；本地压缩把上一帧 Chapter 2 正文并入新帧的并入量上限，
  # 超出部分退化为锚点：segment_id + request 首尾 + 一句话，细节靠检索回读）。
  # 该份正文是唯一进上下文、进缓存前缀的帧内容，不设上限会随帧数膨胀。
  # 2026-09-29 由 1024 上调到 4096：现场帧（本会话 21:21:42 / 21:23:19 两条）的
  # Chapter 2 正文分别是 4159 / 3087 token，原上限让**每一条**帧都在并入那一步
  # 退化成锚点——帧里只剩"前一帧在哪"，用户读到的就是"压缩的内容很小"。
  context_frame_carry_tokens: 4096
  # ── 压缩处 LLM 章节化摘要（前缀重放厚摘要）─────────────────────
  # 出厂**打开**（本文件 enabled: true，2026-09-29 起），且**缺省即开**（2026-10-04
  # 起）。口径分三层，别互相搬：
  #   · 整块缺失 / 块在但没写 enabled 键 → **开**（"没表态"按出厂档走；判定在
  #     seelexctx.LoadLimits 与 DefaultLimits——bool 字段的零值分不清"没写"与
  #     "写了 false"，所以这份区分留在配置入口）；
  #   · 显式 enabled: false → **关**：恒走本地确定性压缩（帧 summary_source=local），
  #     一次模型调用都不发，不静默降级——这一个值就是回滚臂；
  #   · 直接构造 Limits{} 的宿主/测试 → 关（字段零值不变，WithDefaults 不补这一位）。
  # 出厂文件这一行有测试钉着
  # （seelebridge/runtime_compaction_switch_test.go 的 TestShippedCompactionSummarySwitchShipsOpen；
  #   缺省语义由 seelexctx/limits_test.go 的 TestLimitsCompactionSummaryDefaultsOpen 钉住）。
  #
  # 打开一次失败的排障入口：帧正文 JSON 的 readback.note 与 Markdown 的
  # 「压缩材料」段都会写出这次**为什么没有模型读后感**（开关关闭 / 无重放素材 /
  # 重放调用失败 / 连栈帧都没推成）。2026-10-04 现场：那一跳的会话上下文存储未绑定
  # → 推帧失败，帧里只剩任务台账证据——这种是**接线**问题，与开关无关。
  #
  # 打开的代价：这是**新增的、无人值守的付费调用**——每次压缩一次；溢出区超过
  # input_tokens 片预算时分片重放，按片多次。
  # 打开的收益：帧 Chapter 2 从"任务台账的元数据投影"变成真摘要，
  # 「错误与修复 / 待办 / 下一步」三节不再恒 (none)，从而给 search_history 的
  # 词法初筛提供有区分度的关键词（检索器是确定性词法匹配，没有 embedding、
  # 没有同义词表，摘要是唯一能注入别名的地方）。
  #
  # 只在**装配层压缩**（回合开始前那条路径）注入：那里手里握着上一次真实请求的
  # system/history/tools 三样原件，重放请求能与真实请求共享字节前缀、几乎全命中
  # 缓存。回合内控制器路径的字节同源性尚未验证，暂不注入（会付全价却拿不到缓存）。
  # 接线（2026-09-29）：装配层压缩推帧这一跳现在真的会走这条 DAG
  # （application/core/context_runtime 的 pushCompactionFrame →
  # seelebridge/runtime_compaction_index.go 的 PushCompactionFrame →
  # MainCompactionDAG），因此**打开就生效**：栈帧 summary_source=replay、帧正文原样
  # 嵌入该摘要；关闭恒本地压缩（summary_source=local）。
  # 两臂都有离线用例钉住（见上面那个测试文件）：关 → 摘要器 nil + 零付费调用 +
  # summary_source=local；开 → 摘要器非 nil + 恰好一次前缀重放调用 + summary_source=replay。
  context_compaction_summary:
    enabled: true            # 2026-09-29 打开：此后每次装配层压缩多一次无人值守的付费调用
    input_tokens: 0          # 分片重放片预算；0 = 沿用既有推导（账号窗口 × 3/4），不是"不分片"
    chapter2_tokens: 0       # 厚摘要输出预算；0 → 2048
  tool_token_overhead: 64        # 工具 token 估算开销（默认 64）
  context_max_units: 4           # 上下文压缩扫描单元上限（默认 4）
  message_shard_size: 100        # 会话存储分片条数（默认 100）
  summary_chars: 800             # 项目记录摘要截断（默认 800）
  # 工具结果最大**字符数**（不是 token，也不是压缩阈值——见上面《三个容易混的数》③）：
  # 超过即整条归档为 result_ref、请求里只留省略块与引用。
  # 三层同源消费（此前只有应用层跟着配置走）：回合内 processor、框架控制器的
  # "这条结果算不算超大"判定、应用层归档。调大 → 更多原文直接进上下文（少一次
  # 回读往返，但更快撞上压缩线）；调小 → 更早外置，模型要多调一次 read_tool_result。
  # fork 汇总按子代理数 ×n 放大，窗口是容灾上限不是截断线。
  max_tool_result_chars: 60000
  snapshot_tool_output_chars: 8000 # 可见会话快照单条工具输出上限（默认 8000）：超限只留预览进快照，完整内容归档 result_ref 点击再取——WebView2 渲染内存截断线（治本）
  # docker 守护进程自动恢复：bash 命令因 Docker Desktop 未运行失败时自动
  # 启动守护进程并重跑一次（默认开启；关闭需显式 disable_docker_auto_start: true）
  # disable_docker_auto_start: false
  # docker_start_timeout: 60     # 启动等待上限（秒；默认 60）
  # ── teamwork（leader + 异步 worker 作业面）───────────────────────
  # 产品级约束块（docs/arch/teamwork-leader-worker-architecture.md §4.3）。
  # 为什么不能只靠框架的 jobs 在途上限：teammate 不挂子代理（D6 硬移除
  # fork_subagents）⇒ worktree 数量被 teammate 数量封顶 ⇒「人数上限」就是
  # 「工作区不累积残留」的那条产品级约束；框架的 InFlight（32）只是兜底，
  # 撞到它说明这条产品约束已经失效。超限的 team_plan / team_dispatch 显式
  # 拒绝，不静默排队（排队会把"人满了"伪装成"在跑"）。
  team:
    max_teammates: 6             # 同时在编 teammate 人数上限（默认 6，与 resident_limit 同量级；负值启动期报错）
  # ── 插件装配（能力轴；与 teammate 的权限轴 tools_policy/permission_groups 正交）
  # teammate 的装配是两个正交轴：**权限**（能给什么位，只有 leader/宿主能给）与
  # **能力**（挂哪些插件 = skills + 工具收窄 + 提示词，可以随插件分发）。外部一手
  # 实读印证了这条边界：从插件加载的子代理，permissionMode/hooks/mcpServers 一律被
  # 忽略（https://code.claude.com/docs/en/sub-agents，2026-10-05）。
  # 上限超出的 team_plan **显式拒绝**（不静默截断：截断会让"我装配了"与实际生效
  # 不一致）；未知名同样显式拒绝。每个插件每轮都要把技能目录（name+description）
  # 放进上下文，所以上限是产品级约束而不是性能调优。
  plugins:
    per_teammate: 3              # 每会话插件装配上限（出厂 3；非正值按出厂默认）
  # ── v8 会话存储参数（my_design §11；全部缺省 = 存储内置默认，注释即为默认值）
  # 覆盖链：存储内置默认 ← 本段 ← 数据根内 session-storage.json。
  session_storage:
    # 尝试缓存（运行期，不落盘）
    # retry_cache_max_items: 64                 # 条目上限
    # retry_cache_max_chars: 8388608            # 字符上限（8 MB）
    # retry_cache_wire_recent_errors: 3         # 同一操作最近 K 条进 wire
    # wire 装配预算（§5.2）：软阈值触发压缩，目标比例决定裁剪到哪
    # wire_budget_tokens: 200000
    # wire_soft_ratio: 0.75
    # wire_target_ratio: 0.60
    # retention（LRU 只删水位前连续前缀，且必须用户确认）
    # retention_compact_frame_threshold: 30
    # retention_raw_bytes_alert: 268435456      # 256 MB
    # retention_mode: manual                    # 当前只实现 manual
    # queue_persist_pending: true               # 待发送队列落盘恢复
    # 数据根独占锁（§9）
    # lock_stale_after_seconds: 300             # 心跳超龄即判陈旧
    lock_auto_recover: true                    # 陈旧锁自动接管（仅当持有者进程已消失/心跳超时）
    # 超大工具输出 blob（§2.6）
    # big_tool_result_soft_limit_chars: 60000   # 软限截断后归档
    # big_tool_result_hard_limit_bytes: 16777216 # 硬限直接报错
    # big_tool_result_session_quota_bytes: 67108864 # 单会话配额
    # 会话媒体分区（§10：meta/<hash>/<原名>，配额与上面独立计账）
    # media_max_item_bytes: 8388608             # 单件硬限（8 MB）；超出直接拒绝，永不截断
    # media_session_quota_bytes: 268435456      # 单会话媒体配额（256 MB）
    # media_max_items_per_session: 500
    # media_max_long_side: 4096                 # 像素长边；超出需调用方先降采样
  # fork 子代理长任务宽松预算：fork_subagents 总时长 = 子代理工作量之和，
  # 不受通用工具超时（tool_call_timeout）限制，用独立预算（默认 2 小时）。
  # 子代理循环数复用 effort 调节值（high=48 / max=96），无需单独配置。
  # fork_timeout: 7200           # fork 工具总超时（秒；默认 7200 = 2h）
  # 作业面（子进程调用系契约）：bash_bg 派发后立刻返回受理回执（handle+log_path），
  # 结果经 job_manage(op=fetch, handle) 分次取回（消费式：每次只给新增部分），
  # op=observe 只读看进展（不消费输出）、op=kill 终止整棵进程树、op=done 销项。
  # 同一套契约还覆盖 read_batch（批量读作业化）与 fork_subagents 的 async 模式。
  # 出厂常驻开 = 这些入口一直在模型的工具面上；代价是它们的 schema 每轮常驻。
  # 置 false = 整块收回能力：bash_bg / read_batch / job_manage 都不注册，
  # fork_subagents 的 async 模式显式拒绝，bash 收到旧入参 background=true 直接拒绝
  # （能力不可实施时不得静默降级成同步执行）。
  # 串行与后台之间还有一条时长线：显式 timeout 超过 5 分钟（serialBashBudget）的
  # bash 调用被拒绝并指向 bash_bg；关闭本块时**不**审查——没有替代入口时
  # 拒绝一条长命令等于既不执行也不给路。
  # 提示词侧条文：internal/promptassets/assets/system/instructions.md「Long-Running Commands」。
  # 规格与实测：docs/2026-09-24-async-tool-deferred-ack/README.md §8/§10。
  async_exec:
    enabled: true                # 常驻开；改回 false 即整块收回
    # 后台作业落到**终态**时，为它所属会话起一个回合，让模型自己去
    # job_manage(op=fetch) 取回结果并继续（作业面是轮询型：模型答完就停，
    # 结果没人取回是它的固有缺口，见 2026-09-24-async-tool-deferred-ack §10.5）。
    # done 与 failed 都触发；killed 不触发。只在会话**空闲**时触发——忙会话不被打断、
    # 也不进它的队列（铁律 §6.1），它下一次回合边界的打点块本来就会列出完成行。
    # 置 false = 关（默认关，出厂打开；关就是关，无静默降级）。
    trigger_conversation: true
  # ── 项目看板（project_board：会话级任务/里程碑派生投影）──────────────
  # 把**已经存在**的两份投影（工作表格 buildWorkTable + teamwork 计划/运行态）按会话
  # 落成**项目目录**下**按会话分目录**的追加式派生件（2026-10-15：先搬进项目根，再按会话分目录）：
  #     <项目根>/.seelex/board/<会话 ID>/worktable.jsonl   ← 任务行（会话私有：防串写）
  #     <项目根>/.seelex/board/<会话 ID>/teamwork.jsonl     ← 里程碑 / 工作项行
  #     <项目根>/.seelex/board/BOARD.md                     ← 人读件（全项目汇总；外部 agent 直接读这份）
  #     <项目根>/.seelex/board/project-known.md             ← 项目摘要（project_refresh 渲染）
  # `<项目根>` = 该会话所属工作区的根；**未绑定工作区的会话没有落点 ⇒ 不落盘**
  # （没有落点就没有投影，不会退回数据根）。
  # 由**既有**工具完成段被动落盘（在 refreshWorkTableFromSources 之后标脏 + 唤醒，
  # 不新造回调）；投影**不进**任何常驻上下文（system/project 前缀与请求尾部都不进），
  # 只在提示词要求时按需读取。契约：docs/arch/seelex-project-board.md。
  #
  # 本档**打开**（false = 关）：关就是关——不注入订阅口、不触发、一个文件都不写，
  # 读取面（技能条目 + project_board_read 只读工具）也不注册，无静默降级。
  # 打开后：开销只在"工具完成"这条热路径上（去抖合并 + 内容指纹去重，内容没变不写盘）。
  # 注：`.seelex/` 在仓库级 .gitignore 的"运行时数据"段里 ⇒ 投影与 project-known.md
  # 默认不入库（谁提交、要不要提交由使用者决定）。
  project_board:
    enabled: true
    # 触发面：off | todo_list（缺省）| task_complete | tool_complete | all。
    #   off                不触发（比 enabled:false 更细的一档，成本 0）
    #   todo_list          todo/task 族工具成功后触发（覆盖不到"从不调 todo"的会话）
    #   task_complete      只在会话终态工具后触发（项目状态滞后到回合末）
    #   tool_complete/all  任何工具完成后触发（靠去抖 + 指纹去重压写盘次数）
    # 拼错的名字在启动期**显式报错**（不静默降级成"从不触发"）。
    hook: "todo_list"
    # 落盘去抖窗（毫秒）：窗内多次触发只落一次盘；0 = 用缺省（2000）。
    flush_idle_ms: 2000
    # 注：没有 max_rows —— 单次追加的行数上限是存储面的硬不变量
    # （sessionstore.ProjectBoardMaxRows）。累计越界时存储面先**压实**（折成每个
    # (会话, Key) 的最新一行再原子重写），压实后仍越界才显式报错；配置里再放一个上限
    # 就是对同一次追加的第二份判据。
  # ── 进程级启动行为（runtime）────────────────────────────────────
  # 是否同意**多进程**共用同一数据根。默认 false = 单实例：数据根独占锁
  # （sessionstore/data_root_lock.go 的 lock.owner）把「单数据根 = 单进程写者」
  # 钉成不变量，第二个进程启动即被拒绝（main.guardMultiProcess 给可读拒绝）。
  #
  # 只有明确知情才打开：
  #   - true 时第二个进程不再被数据根锁拒绝（存储侧 allow_multi_process）；
  #   - **代价**：多个进程可同时写同一数据根，失去跨进程写者串行化——进程内的
  #     模块锁不跨进程，并发写同一会话/同一模块会互相覆盖。谁保证一致性 = 使用者
  #     （典型用法是只读的旁路进程，或把并发写分给不同数据根）。
  #   - 关就是关（零值 = false = 单实例），可一键回滚。
  runtime:
    allow_multi_process: false   # 默认单实例；true = 放行第二个进程（代价见上）
#
# 子代理超时速查：子代理执行长命令被掐，先调 tool_call_timeout；
# 审批弹窗超时调 approval_timeout；子代理循环上限调 plan_node_max_loops。
