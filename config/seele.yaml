# ── Seele 权限配置 ──────────────────────────────────────────
# 声明式权限规则，控制工具的 allow / ask / deny 行为。
# 规则按顺序评估，最后匹配的规则胜出（LMRW）。
#
# 注意：最后匹配的规则覆盖之前的匹配，所以：
#   1. 宽泛规则放在前面（默认行为）
#   2. 精确覆盖规则放在后面
#
# 将此文件放在 seelex 工作目录下以启用权限门控。

permission:
  rules:
    # ─ 默认兜底：未明确允许的工具 → ask ─
    - tool: "*"
      action: ask

    # ─ 安全/只读工具 → 直接允许 ─
    - tool: "read_file"
      action: allow
    - tool: "glob"
      action: allow
    - tool: "grep*"
      action: allow
    - tool: "get_time"
      action: allow
    - tool: "mcp_load"
      action: allow
    - tool: "git_status"
      action: allow
    - tool: "git_log"
      action: allow
    - tool: "git_diff"
      action: allow

    # ─ computer use：看屏幕只读，动鼠标键盘逐次审批 ─
    # 截屏会把画面送进模型上下文（含屏幕上的任何内容），因此即使"只读"也
    # 默认逐次确认；要放开可把下面两条改成 allow。
    - tool: "computer_screenshot"
      action: ask
    - tool: "computer_windows"
      action: ask
    # 输入注入会真实改变用户桌面：保持 ask（不要改成 allow，除非明确接受
    # 模型可无人值守操作键鼠）。
    - tool: "computer_click"
      action: ask
    - tool: "computer_move"
      action: ask
    - tool: "computer_drag"
      action: ask
    - tool: "computer_scroll"
      action: ask
    - tool: "computer_type"
      action: ask
    - tool: "computer_keys"
      action: ask
    - tool: "computer_focus"
      action: ask
    - tool: "computer_wait"
      action: allow

    # ─ 安全的 bash 命令模式 → 直接允许 ─
    - tool: "bash"
      patterns: ["git *", "ls *", "cat *", "echo *", "head *", "tail *"]
      action: allow
    - tool: "bash"
      patterns: ["pwd", "which *", "whoami", "date", "df *", "du *", "printenv"]
      action: allow

    # ─ 写操作 → 需要审批 ─
    - tool: "edit"
      action: ask
    - tool: "write_file"
      action: ask
    - tool: "create_file"
      action: ask

    - tool: "bash"
      patterns: ["npm install *", "go build *", "make *", "docker *"]
      action: ask

    # ─ 危险操作 → 拒绝或审批 ─
    - tool: "bash"
      patterns: ["rm -rf /*", ":(){ :|:& };:", "dd if=* of=*"]
      action: deny
    - tool: "delete"
      action: deny

    - tool: "bash"
      patterns: ["rm *", "mv *", "chmod *", "chown *"]
      action: ask

# 权限规则按顺序评估，最后匹配的规则胜出（LMRW）。
# 运行参数（window / limits）在 seelex.yaml；本文件只放权限。
