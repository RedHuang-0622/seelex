# Copy this file to accounts.yaml and replace the placeholder values.
# Never commit accounts.yaml or any *.local.yaml / *.secret.yaml file.
# Accounts are grouped by task role. Add one or more entries under each role.
defaults:
  provider: openai
  # Total model context window. This is not the response token limit.
  context_window: 200000
  max_tokens: 8192
  timeout: 120s
  temperature: 0

websearch:
  max_results: 5
  include_answer: true
  search_depth: advanced
  # timeout: 15                # 可选：覆盖 limits.search_timeout
  # active: gateway            # 可选：多策略时选中一个；缺省取第一个
  # strategies:                # 代理策略列表。三种接入方式，入参/出参一致：
  #   # 1) 标准协议端点 / 自建网关：只需端点与密钥，请求/响应走标准
  #   #    websearch 协议（Tavily 兼容）；type 省略或写 standard
  #   - name: gateway
  #     endpoint: https://your-gateway.example/search
  #     api_key: replace-with-your-key
  #   # 2) 内置厂商适配器：type 指定厂商名，走该厂商专有协议，无需自建网关
  #   - name: bocha
  #     type: bochaai          # 博查 Web Search API（api_key 必填，端点可选）
  #     api_key: replace-with-your-bochaai-key
  #   - name: sx
  #     type: searxng          # SearXNG JSON API（endpoint 必填，api_key 可选）
  #     endpoint: https://searx.example.org/search
  #   # 启用 strategies 后请把下方 provider/api_key 注释掉，或用 active 显式
  #   # 指定使用哪个策略。

  # 旧字段兼容：未声明 strategies 时 provider/api_key 自动翻译——
  # provider: tavily + api_key 走内置 tavily 标准协议；
  # provider: bochaai + api_key 走内置博查适配器。现有配置无需修改。
  provider: tavily
  api_key: replace-with-your-tavily-api-key

roles:
  # SubAgent: fast, isolated task execution.
  subagent:
    - model: replace-with-subagent-model
      base_url: https://api.openai.com/v1
      api_key: replace-with-your-api-key

  # Agent: default interactive assistant.
  agent:
    - model: replace-with-agent-model
      base_url: https://api.openai.com/v1
      api_key: replace-with-your-api-key

  # GoalPlan: deep reasoning and planning.
  goalplan:
    - model: replace-with-goalplan-model
      base_url: https://api.openai.com/v1
      api_key: replace-with-your-api-key

mcp_servers: []
