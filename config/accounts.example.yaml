# Copy this file to accounts.yaml and replace the placeholder values.
# Never commit accounts.yaml or any *.local.yaml / *.secret.yaml file.
# Accounts are grouped by task role. Add one or more entries under each role.
defaults:
  provider: openai
  # Total model context window. This is not the response token limit.
  context_window: 200000
  max_tokens: 8192
  timeout: 120s
  temperature: 0

websearch:
  max_results: 5
  include_answer: true
  search_depth: advanced
  # timeout: 15                # 可选：覆盖 limits.search_timeout
  # active: searxng            # 可选：多策略时选中一个；缺省取第一个
  # strategies:                # 代理策略列表：只需端点与密钥，请求/响应走
  #                            # 标准 websearch 协议（Tavily 兼容）；
  #                            # 启用 strategies 后请把下方 provider/api_key
  #                            # 注释掉，或用 active 显式指定使用哪个策略。
  #   - name: searxng
  #     endpoint: https://searx.example.org/search
  #     apikey: replace-with-your-key

  # 旧字段兼容：provider: tavily + api_key 等价于内置 tavily 策略模板，
  # 未声明 strategies 时自动翻译，现有配置无需修改。
  provider: tavily
  api_key: replace-with-your-tavily-api-key

roles:
  # SubAgent: fast, isolated task execution.
  subagent:
    - model: replace-with-subagent-model
      base_url: https://api.openai.com/v1
      api_key: replace-with-your-api-key

  # Agent: default interactive assistant.
  agent:
    - model: replace-with-agent-model
      base_url: https://api.openai.com/v1
      api_key: replace-with-your-api-key

  # GoalPlan: deep reasoning and planning.
  goalplan:
    - model: replace-with-goalplan-model
      base_url: https://api.openai.com/v1
      api_key: replace-with-your-api-key

mcp_servers: []
