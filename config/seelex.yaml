# ── Seelex 运行参数配置 ─────────────────────────────────────
# 本文件只放行为参数（上下文窗口 / 运行时上限）；权限规则在 seele.yaml。
# 缺失字段 → 默认值（与旧硬编码一致）；无需改代码即可调参。

# ── 上下文滑动窗口（window）─────────────────────────────
# 会话请求保留的最新完整轮数 N：N = clamp((上下文窗口 × ratio − 预留) ÷ 每轮 token,
# min_rounds, max_rounds)。零值 = 未配置，使用默认值（ratio 0.7 / min_rounds 4 /
# max_rounds 40）；rounds 显式配置时直接覆盖推导结果。
# 轮数公式的实际生效面：框架上下文控制器（seelexctx Controller，有每轮 token 估算）。
# 主会话冷恢复的读分片宽度只拿得到上下文窗口一个输入，推导分支不生效，恒等于
# min_rounds（见 seelebridge/runtime_context.go 的 windowTailBudget）。轮数也不是压缩
# 保留前缀的口径：保留前缀只由下面的 min(token1, token2) token 规则决定。
#
# 压缩保留前缀窗口（软压缩）：保留前缀 token 预算 = min(token1, token2)，取两个
# 窗口的较小者，窗口外部分尽数交给 compact_context 折叠（原始轮次仍在会话存储里）：
#   token1 = retain_tokens（硬编码在配置里的保留窗口 token 数；0 = 未配置 → 回退账号
#            上下文窗口 accounts.yaml context_window）
#   token2 = ratio × all_context（全量上下文 token 数 × 可用比例）
# 同一规则也是**读尾**（冷恢复装载 transcript/history 尾部）的 token 预算：读尾发生在
# 请求装配之前、没有"本次要携带的上下文"可估，all_context 取账号上下文窗口——
# 未达上限的会话不会被占比窗口误裁，读尾只做重建、不新做压缩决策。
# 硬压缩：all_context ≥ force_compact_tokens 时必须自主压缩，不再等 provider 比例阈值
# （0 = 未配置，压缩只由软策略驱动）。
window:
  rounds: 0        # 显式覆盖窗口轮数（0 = provider 推导 clamp；该推导只对框架控制器路径
                   # 有完整输入，主会话冷读分片宽度取 min_rounds）
  ratio: 0.7       # 上下文窗口可用比例（同时是占比窗口 token2 的比例）
  retain_tokens: 0 # 保留窗口 token 数 token1（0 = 回退账号上下文窗口）
  force_compact_tokens: 0 # 硬压缩阈值：all_context token 数（0 = 只走软压缩）
  min_rounds: 4    # 轮数下限（clamp 下界；也是主会话冷读分片的实际宽度）
  max_rounds: 40   # 轮数上限（clamp 上界，只对框架控制器路径生效）

# ── 运行时上限（limits）─────────────────────────────────
# 全部行为魔法数字收编为可调参数；缺失字段 → 默认值（与旧硬编码一致）。
# 时延类单位：秒（0 仅 tool_call_timeout 表示无限制）。
limits:
  tool_call_timeout: 1800        # 工具调用超时秒（0 = 无限制；默认 1800 = 30 分钟）
  approval_timeout: 600          # 审批等待秒（默认 600 = 10 分钟）
  plan_decision_timeout: 10      # preflight 决策回合秒（默认 10）
  heartbeat_interval: 15         # workplan 心跳间隔秒（默认 15；详情页"最后活跃"时间线）
  replan_window: 60              # replan 频率窗口秒（默认 60）
  search_timeout: 15             # 搜索 HTTP 超时秒（默认 15；旧字段 tavily_timeout 兼容）
  max_concurrent_replans: 2      # replan 并发上限（默认 2）
  max_replans_per_window: 6      # 窗口内 replan 次数（默认 6）
  max_replan_provider_requests: 6 # 窗口内 provider 请求预算（默认 6）
  max_replans_per_plan_chain: 2  # 单计划链 replan 次数（默认 2）
  history_window: 200            # 会话可见历史条数（默认 200）
  loaded_content_limit: 12       # 已加载会话内容（可见正文）LRU 上限（默认 12；视图未激活且空闲的会话可被释放正文，重开冷回读）
  plan_node_events: 30           # 节点详情时间线上限（默认 30）
  plan_node_max_loops: 15        # 子代理节点循环上限（默认 15）
  evidence_chars: 800            # 证据/输出截断（默认 800）
  work_table_rows: 200           # 工作表格最大行数（默认 200；概览打点 ≤10/行）
  replan_evidence_bytes: 12288   # replan 证据字节上限（默认 12 KB）
  input_loop_limit: 9999         # 输入循环上限（默认 9999 ≈ 无上限）
  reference_page_size: 4000      # read_tool_result/read_compressed_turn 默认分页（默认 4000）
  max_reference_page_size: 12000 # 分页上限（默认 12000）
  grep_max_results: 20           # grep 默认结果数（默认 20）
  session_name_runes: 16         # 会话名截断（默认 16）
  preflight_retry: 2             # preflight 重试次数（默认 2）
  output_reserve_tokens: 512     # provider 输出预留 token（默认 512）
  # ── 上下文压缩预算（0 = 用默认值）───────────────────────────────
  # 预算 budget = context_window − output_reserve_tokens − context_window ÷ 安全除数；
  # 下面各百分比都以 budget 为基数。**同一份值被两个触发层消费**（不再各说各话）：
  #   ① 回合边界装配（application/core/task_context 判据：每次给模型发请求前算一次）
  #   ② 回合内框架控制器（seelexctx：每收一个工具结果 / 每闭合一轮就判一次）
  # 代码内置默认档（配置缺失时的兜底）与这里一致：8/95/98/80/50（2026-09-26 起
  # 上调；旧 75/90 的保留窗口落点贴着软线，一轮的体积增长就重新越线——通知里
  # 「上下文预算达峰 · 自动阈值」因此一轮对话压一次）。上调后只有请求真的逼近
  # 预算上限才折叠（预算已先扣掉输出预留 + 安全预留，100% 的预算 ≠ 窗口上限，
  # 所以 95/98 仍是安全网而非"关掉压缩"）。
  # 约束：context_soft_percent 必须 < context_hard_percent —— 硬线是"装配后仍越线
  # 就立刻自主折叠"的抢跑路径；软线高于硬线时自主折叠会每轮抢跑，反倒压得更勤。
  context_safety_reserve_divisor: 8   # 安全预留 = 窗口 ÷ 该值。调小（如 4）→ 预留更多、预算更小、更早开始压缩
  context_soft_percent: 95            # 软压缩线：请求估算到达 budget×95% 就折叠可变 transcript。调低 → 压得更早更频繁（省 token，代价是反复重压、provider 前缀缓存更容易失效）；调高 → 少压几轮，但离窗口上限更近
  context_hard_percent: 98            # 硬阈值线：装配后的请求仍 ≥ budget×98% 时立刻自主折成有界 checkpoint 帧（不等软线的下一个纪元）。调低 → 更"绝不贴边发送"；调高 → 允许历史更满
  context_target_percent: 80          # 压缩目标：折叠后把请求大小压回 budget×80% 附近（保留区硬上限），给下一轮留 soft − target = 15% 预算的确定余量。与 soft 的差 = 每次压掉的量；两者相等或反超会导致每轮都重压
  context_single_item_percent: 50     # 单条输入外置阈值：一条输入超 budget×50% 就先归档为 result_ref，请求里只放引用
  # 保留区下限（占预算 %；0 = 未配置 → 下限只剩「至少 1 个完整协议单元」兜底）：
  # 保留区 = clamp(占比 × 全量, floor, retain_tokens)，floor = max(最近 1 个完整协议单元, 该比例 × 预算)。
  # floor > window.retain_tokens 是非法组合，启动期直接报错（不许静默取小）。
  context_retain_floor_percent: 0
  # 帧摘要传递上限（token；本地折叠把上一帧 Chapter 2 正文并入新帧的并入量上限，
  # 超出部分退化为锚点：segment_id + request 首尾 + 一句话，细节靠检索回读）。
  # 该份正文是唯一进上下文、进缓存前缀的帧内容，不设上限会随帧数膨胀。
  context_frame_carry_tokens: 1024
  # ── 折叠处 LLM 章节化摘要（前缀重放厚摘要）─────────────────────
  # 默认**关闭**（整块缺失即关）。关就是关：折叠恒走本地确定性折叠
  # （帧 summary_source=local），一次模型调用都不发，不静默降级、可一键回滚。
  #
  # 打开的代价：这是**新增的、无人值守的付费调用**——每次折叠一次；溢出区超过
  # input_tokens 片预算时分片重放，按片多次。
  # 打开的收益：帧 Chapter 2 从"任务台账的元数据投影"变成真摘要，
  # 「错误与修复 / 待办 / 下一步」三节不再恒 (none)，从而给 search_history 的
  # 词法初筛提供有区分度的关键词（检索器是确定性词法匹配，没有 embedding、
  # 没有同义词表，摘要是唯一能注入别名的地方）。
  #
  # 只在**装配层折叠**（回合开始前那条路径）注入：那里手里握着上一次真实请求的
  # system/history/tools 三样原件，重放请求能与真实请求共享字节前缀、几乎全命中
  # 缓存。回合内控制器路径的字节同源性尚未验证，暂不注入（会付全价却拿不到缓存）。
  # 接线（2026-09-29）：装配层折叠推帧这一跳现在真的会走这条 DAG
  # （application/core/context_runtime 的 pushCompactionFrame →
  # seelebridge/runtime_compaction_index.go 的 PushCompactionFrame →
  # MainCompactionDAG），因此**打开就生效**：栈帧 summary_source=replay、帧正文原样
  # 嵌入该摘要；关闭恒本地折叠（summary_source=local）。
  # context_compaction_summary:
  #   enabled: false
  #   input_tokens: 0        # 分片重放片预算；0 = 沿用既有推导（账号窗口 × 3/4），不是"不分片"
  #   chapter2_tokens: 0     # 厚摘要输出预算；0 → 2048
  tool_token_overhead: 64        # 工具 token 估算开销（默认 64）
  context_max_units: 4           # 上下文压缩扫描单元上限（默认 4）
  message_shard_size: 100        # 会话存储分片条数（默认 100）
  summary_chars: 800             # 项目记录摘要截断（默认 800）
  # 工具结果最大字符数：超过即整条归档为 result_ref、请求里只留省略块与引用。
  # 三层同源消费（此前只有应用层跟着配置走）：回合内 processor、框架控制器的
  # "这条结果算不算超大"判定、应用层归档。调大 → 更多原文直接进上下文（少一次
  # 回读往返，但更快撞上压缩线）；调小 → 更早外置，模型要多调一次 read_tool_result。
  # fork 汇总按子代理数 ×n 放大，窗口是容灾上限不是截断线。
  max_tool_result_chars: 60000
  snapshot_tool_output_chars: 8000 # 可见会话快照单条工具输出上限（默认 8000）：超限只留预览进快照，完整内容归档 result_ref 点击再取——WebView2 渲染内存截断线（治本）
  # docker 守护进程自动恢复：bash 命令因 Docker Desktop 未运行失败时自动
  # 启动守护进程并重跑一次（默认开启；关闭需显式 disable_docker_auto_start: true）
  # disable_docker_auto_start: false
  # docker_start_timeout: 60     # 启动等待上限（秒；默认 60）
  # ── v8 会话存储参数（my_design §11；全部缺省 = 存储内置默认，注释即为默认值）
  # 覆盖链：存储内置默认 ← 本段 ← 数据根内 session-storage.json。
  session_storage:
    # 尝试缓存（运行期，不落盘）
    # retry_cache_max_items: 64                 # 条目上限
    # retry_cache_max_chars: 8388608            # 字符上限（8 MB）
    # retry_cache_wire_recent_errors: 3         # 同一操作最近 K 条进 wire
    # wire 装配预算（§5.2）：软阈值触发压缩，目标比例决定裁剪到哪
    # wire_budget_tokens: 200000
    # wire_soft_ratio: 0.75
    # wire_target_ratio: 0.60
    # retention（LRU 只删水位前连续前缀，且必须用户确认）
    # retention_compact_frame_threshold: 30
    # retention_raw_bytes_alert: 268435456      # 256 MB
    # retention_mode: manual                    # 当前只实现 manual
    # queue_persist_pending: true               # 待发送队列落盘恢复
    # 数据根独占锁（§9）
    # lock_stale_after_seconds: 300             # 心跳超龄即判陈旧
    lock_auto_recover: true                    # 陈旧锁自动接管（仅当持有者进程已消失/心跳超时）
    # 超大工具输出 blob（§2.6）
    # big_tool_result_soft_limit_chars: 60000   # 软限截断后归档
    # big_tool_result_hard_limit_bytes: 16777216 # 硬限直接报错
    # big_tool_result_session_quota_bytes: 67108864 # 单会话配额
    # 会话媒体分区（§10：meta/<hash>/<原名>，配额与上面独立计账）
    # media_max_item_bytes: 8388608             # 单件硬限（8 MB）；超出直接拒绝，永不截断
    # media_session_quota_bytes: 268435456      # 单会话媒体配额（256 MB）
    # media_max_items_per_session: 500
    # media_max_long_side: 4096                 # 像素长边；超出需调用方先降采样
  # fork 子代理长任务宽松预算：fork_subagents 总时长 = 子代理工作量之和，
  # 不受通用工具超时（tool_call_timeout）限制，用独立预算（默认 2 小时）。
  # 子代理循环数复用 effort 调节值（high=48 / max=96），无需单独配置。
  # fork_timeout: 7200           # fork 工具总超时（秒；默认 7200 = 2h）
  # 作业面（子进程调用系契约）：bash_bg 派发后立刻返回受理回执（handle+log_path），
  # 结果经 job_manage(op=fetch, handle) 分次取回（消费式：每次只给新增部分），
  # op=observe 只读看进展（不消费输出）、op=kill 终止整棵进程树、op=done 销项。
  # 同一套契约还覆盖 read_batch（批量读作业化）与 fork_subagents 的 async 模式。
  # 出厂常驻开 = 这些入口一直在模型的工具面上；代价是它们的 schema 每轮常驻。
  # 置 false = 整块收回能力：bash_bg / read_batch / job_manage 都不注册，
  # fork_subagents 的 async 模式显式拒绝，bash 收到旧入参 background=true 直接拒绝
  # （能力不可实施时不得静默降级成同步执行）。
  # 串行与后台之间还有一条时长线：显式 timeout 超过 5 分钟（serialBashBudget）的
  # bash / bash_read 调用被拒绝并指向 bash_bg；关闭本块时**不**审查——没有替代入口时
  # 拒绝一条长命令等于既不执行也不给路。
  # 提示词侧条文：internal/promptassets/assets/system/instructions.md「Long-Running Commands」。
  # 规格与实测：docs/2026-09-24-async-tool-deferred-ack/README.md §8/§10。
  async_exec:
    enabled: true                # 常驻开；改回 false 即整块收回
#
# 子代理超时速查：子代理执行长命令被掐，先调 tool_call_timeout；
# 审批弹窗超时调 approval_timeout；子代理循环上限调 plan_node_max_loops。
