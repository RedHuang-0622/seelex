# ── Seele 权限配置 ──────────────────────────────────────────
# 声明式权限规则，控制工具的 allow / ask / deny 行为。
# 规则按顺序评估，最后匹配的规则胜出（LMRW）。
#
# 注意：最后匹配的规则覆盖之前的匹配，所以：
#   1. 宽泛规则放在前面（默认行为）
#   2. 精确覆盖规则放在后面
#
# 将此文件放在 seelex 工作目录下以启用权限门控。

permission:
  rules:
    # ─ 默认兜底：未明确允许的工具 → ask ─
    - tool: "*"
      action: ask

    # ─ 安全/只读工具 → 直接允许 ─
    - tool: "read_file"
      action: allow
    - tool: "glob"
      action: allow
    - tool: "grep*"
      action: allow
    - tool: "get_time"
      action: allow
    - tool: "git_status"
      action: allow
    - tool: "git_log"
      action: allow
    - tool: "git_diff"
      action: allow

    # ─ 安全的 bash 命令模式 → 直接允许 ─
    - tool: "bash"
      patterns: ["git *", "ls *", "cat *", "echo *", "head *", "tail *"]
      action: allow
    - tool: "bash"
      patterns: ["pwd", "which *", "whoami", "date", "df *", "du *", "printenv"]
      action: allow

    # ─ 写操作 → 需要审批 ─
    - tool: "edit"
      action: ask
    - tool: "write_file"
      action: ask
    - tool: "create_file"
      action: ask

    - tool: "bash"
      patterns: ["npm install *", "go build *", "make *", "docker *"]
      action: ask

    # ─ 危险操作 → 拒绝或审批 ─
    - tool: "bash"
      patterns: ["rm -rf /*", ":(){ :|:& };:", "dd if=* of=*"]
      action: deny
    - tool: "delete"
      action: deny

    - tool: "bash"
      patterns: ["rm *", "mv *", "chmod *", "chown *"]
      action: ask

# ── 上下文滑动窗口（window）─────────────────────────────
# 会话请求保留的最新完整轮数 N：N = clamp((上下文窗口 × ratio − 预留) ÷ 每轮 token,
# min_rounds, max_rounds)。零值 = 未配置，使用默认值（ratio 0.7 / min_rounds 4 /
# max_rounds 40）；rounds 显式配置时直接覆盖推导结果。
# window:
#   rounds: 0        # 显式覆盖窗口轮数（0 = 使用 provider 推导）
#   ratio: 0.7       # 上下文窗口可用比例
#   min_rounds: 4    # 窗口下限
#   max_rounds: 40   # 窗口上限

# ── 运行时上限（limits）─────────────────────────────────
# 全部行为魔法数字收编为可调参数；缺失字段 → 默认值（与旧硬编码一致）。
# 时延类单位：秒（0 仅 tool_call_timeout 表示无限制）。
# limits:
#   tool_call_timeout: 1800        # 工具调用超时秒（0 = 无限制；默认 1800 = 30 分钟）
#   approval_timeout: 600          # 审批等待秒（默认 600 = 10 分钟）
#   plan_decision_timeout: 10      # preflight 决策回合秒（默认 10）
#   heartbeat_interval: 15         # workplan 心跳间隔秒（默认 15；详情页"最后活跃"时间线）
#   replan_window: 60              # replan 频率窗口秒（默认 60）
#   tavily_timeout: 15             # tavily HTTP 超时秒（默认 15）
#   max_concurrent_replans: 2      # replan 并发上限（默认 2）
#   max_replans_per_window: 6      # 窗口内 replan 次数（默认 6）
#   max_replan_provider_requests: 6 # 窗口内 provider 请求预算（默认 6）
#   max_replans_per_plan_chain: 2  # 单计划链 replan 次数（默认 2）
#   history_window: 200            # 会话可见历史条数（默认 200）
#   plan_node_events: 30           # 节点详情时间线上限（默认 30）
#   plan_node_max_loops: 15        # 子代理节点循环上限（默认 15）
#   evidence_chars: 800            # 证据/输出截断（默认 800）
#   replan_evidence_bytes: 12288   # replan 证据字节上限（默认 12 KB）
#   input_loop_limit: 9999         # 输入循环上限（默认 9999 ≈ 无上限）
#   reference_page_size: 4000      # read_tool_result/read_compressed_turn 默认分页（默认 4000）
#   max_reference_page_size: 12000 # 分页上限（默认 12000）
#   grep_max_results: 20           # grep 默认结果数（默认 20）
#   session_name_runes: 16         # 会话名截断（默认 16）
#   preflight_retry: 2             # preflight 重试次数（默认 2）
#   output_reserve_tokens: 512     # provider 输出预留 token（默认 512）
#   tool_token_overhead: 64        # 工具 token 估算开销（默认 64）
#   context_max_units: 4           # 上下文压缩扫描单元上限（默认 4）
#   message_shard_size: 100        # 会话存储分片条数（默认 100）
#   summary_chars: 800             # 项目记录摘要截断（默认 800）
#
# 子代理超时速查：子代理执行长命令被掐，先调 tool_call_timeout；
# 审批弹窗超时调 approval_timeout；子代理循环上限调 plan_node_max_loops。
